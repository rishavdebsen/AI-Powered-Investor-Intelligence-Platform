name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt -r requirements-full.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests evaluation
      - name: Tests
        run: pytest -q
      - name: Retrieval evaluation
        run: python evaluation/run_eval.py
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f docker/api.Dockerfile -t investor-intel-api:ci .
      - name: Build ui image
        run: docker build -f docker/ui.Dockerfile -t investor-intel-ui:ci .
