apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: investor-intel
spec:
  replicas: 1
  selector:
    matchLabels: {app: ui}
  template:
    metadata:
      labels: {app: ui}
    spec:
      containers:
        - name: ui
          image: ACR_NAME.azurecr.io/investor-intel-ui:IMAGE_TAG
          ports: [{containerPort: 8501}]
          env:
            - name: API_URL
              value: "http://api:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: investor-intel
spec:
  type: LoadBalancer
  selector: {app: ui}
  ports: [{port: 80, targetPort: 8501}]
