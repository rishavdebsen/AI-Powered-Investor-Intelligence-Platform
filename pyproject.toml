[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-intel"
version = "1.0.0"
description = "RAG platform for asking questions of company filings, with KPI extraction, evaluation, and AKS deployment"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# timezone.utc is used for Python 3.10-compatible local verification
ignore = ["UP017"]
